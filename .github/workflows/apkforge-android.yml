          function extractBlocksXmltree(t) {
            const lines = t.split('\n');
            const blocks = [];
            let collecting = false;
            let baseIndent = -1;
            let current = [];
            const indentOf = (l) => (l.match(/^\s*/) || [''])[0].length;
            for (const line of lines) {
