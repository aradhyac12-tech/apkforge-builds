          const blocks = isXmltree ? extractBlocksXmltree(text) : extractBlocksXml(text);

          if (!blocks.length) {
            console.error('[manifest-check] FAIL no <intent-filter> elements found in ' + file);
            process.exit(1);
          }

          const has = (block, needle) => block.toLowerCase().includes(needle.toLowerCase());

          let matched = null;
          let matchedScheme = null;
          const nearMisses = [];
          for (const b of blocks) {
            const hasView = has(b, 'android.intent.action.view');
            const hasDefault = has(b, 'android.intent.category.default');
            const hasBrowsable = has(b, 'android.intent.category.browsable');
            if (!(hasView && hasDefault && hasBrowsable)) {
              nearMisses.push('view=' + hasView + ' default=' + hasDefault + ' browsable=' + hasBrowsable);
              continue;
            }
            // Match "scheme" and the expected value inside the same line, quoted —
            // this covers both raw-XML (`android:scheme="duospace"`) and aapt2
            // xmltree (`android:scheme(0x01010027)="duospace"`) shapes, where an
            // attribute's resource-id hex blob sits between the name and the value.
            const valueOnSameLine = (attr, value) => {
              const escaped = value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(attr + '[^\\n]*["\']' + escaped + '["\']', 'i');
              return b.split('\n').some((line) => re.test(line));
            };
            const schemeMatch = expectedSchemes.find((s) => valueOnSameLine('scheme', s));
            const schemeOk = expectedSchemes.length === 0 || !!schemeMatch;
            const hostOk = !expectedHost || valueOnSameLine('host', expectedHost);
            if (schemeOk && hostOk) {
              matched = b;
              matchedScheme = schemeMatch || '(any)';
              break;
            }
          }

          if (!matched) {
            console.error(
              '[manifest-check] FAIL no single <intent-filter> in ' + file +
              ' contains action VIEW + category DEFAULT + category BROWSABLE' +
              (expectedSchemes.length ? ' + scheme in [' + expectedSchemes.join(', ') + ']' : '') +
              (expectedHost ? ' + host=' + expectedHost : '') +
              ' together (' + blocks.length + ' intent-filter element(s) inspected: ' + nearMisses.join(' | ') + ')'
            );
            process.exit(1);
          }
          console.log(
            '[manifest-check] PASS structurally valid VIEW/DEFAULT/BROWSABLE intent-filter found in ' + file +
            (expectedSchemes.length ? ' (scheme=' + matchedScheme + ')' : '')
          );
          process.exit(0);
          CHECKEOF

          OAUTH_SIGNAL=""
          grep -rIlqE --exclude-dir=node_modules --exclude-dir=android --exclude-dir=ios "@supabase/supabase-js|firebase/auth|@auth0/|@clerk/|signInWithOAuth|oauth" . 2>/dev/null && OAUTH_SIGNAL=1

          if [ -n "$OAUTH_SIGNAL" ]; then
            check "@capacitor/browser registered in Gradle" "$(has '@capacitor/browser' "$SETTINGS")" fatal
            check "@capacitor/app registered in Gradle" "$(has '@capacitor/app' "$SETTINGS")" fatal
            check "BrowserPlugin present in capacitor.plugins.json" "$(has 'BrowserPlugin' "$PJ")" fatal
            check "AppPlugin present in capacitor.plugins.json" "$(has 'AppPlugin' "$PJ")" warn
          else
            log "OAUTH_READY: no auth SDK detected — OAuth checks are advisory only"
            check "@capacitor/app registered in Gradle" "$(has '@capacitor/app' "$SETTINGS")" warn
          fi
          check "custom-scheme intent filter present" "$(has 'android:scheme=' "$MANIFEST")" warn
          OAUTH_EXPECTED_SCHEMES=""
          [ -f android-expected-schemes.txt ] && OAUTH_EXPECTED_SCHEMES="$(paste -sd, android-expected-schemes.txt)"
          check "structurally valid VIEW/DEFAULT/BROWSABLE deep-link intent filter" "$(node /tmp/apkforge-manifest-structural-check.cjs "$MANIFEST" "$OAUTH_EXPECTED_SCHEMES" >> "$REPORT" 2>&1; echo $?)" fatal
          check "launchMode=singleTask on MainActivity" "$(has 'android:launchMode="singleTask"' "$MANIFEST")" fatal
          check "appUrlOpen bridge injected" "$(grep -rq 'appUrlOpen' android/app/src/main 2>/dev/null && echo 0 || echo 1)" warn

          if [ -n "$FATAL" ]; then
            echo "OAUTH_VALIDATION_FAILED:$FATAL" | tee -a "$REPORT"
            echo "::error::OAuth readiness validation failed:$FATAL"
            exit 1
          fi
          log "[oauth] OAuth readiness validated"


      - name: Inject Android lifecycle diagnostics
        working-directory: project
        run: |
          set -e
          log() { echo "$1" | tee -a "$REPORT"; }
          log "[oauth-diagnostics] Starting native OAuth lifecycle diagnostics patch (Java + Kotlin MainActivity)"
          cat > /tmp/apkforge-mainactivity-diagnostics.cjs <<'NODEEOF'
          const fs = require('fs');
          const path = require('path');
          const report = process.env.REPORT;
          const log = (m) => { console.log(m); fs.appendFileSync(report, m + '\n'); };

          // Both Java and Kotlin Capacitor Android templates are supported. Capacitor
          // 8.x may generate either MainActivity.java or MainActivity.kt depending on
          // the project template, and this must not assume Java only.
          function walk(dir) {
            const out = [];
            let entries = [];
            try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { return out; }
            for (const e of entries) {
              const full = path.join(dir, e.name);
              if (e.isDirectory()) out.push(...walk(full));
              else if (e.name === 'MainActivity.java' || e.name === 'MainActivity.kt') out.push(full);
            }
            return out;
          }
          const candidates = walk('android/app/src/main/java').concat(walk('android/app/src/main/kotlin'));
          if (!candidates.length) throw new Error('Neither MainActivity.java nor MainActivity.kt was found in the native Android project.');
          // Deterministic when both somehow exist: Java first, matching prior behavior.
          candidates.sort((a, b) => (a.endsWith('.java') ? 0 : 1) - (b.endsWith('.java') ? 0 : 1));
          const mainPath = candidates[0];
          const isKotlin = mainPath.endsWith('.kt');
          log('[oauth-diagnostics] Detected Android ' + (isKotlin ? 'MainActivity.kt (Kotlin)' : 'MainActivity.java (Java)') + ' at ' + mainPath);

          let main = fs.readFileSync(mainPath, 'utf8');
          const pkg = (main.match(/^\s*package\s+([^\s;]+)/m) || [])[1];
          if (!pkg) throw new Error(mainPath + ' has no package declaration.');
          // The file already lives in its package directory under either source set
          // (src/main/java or src/main/kotlin), so derive the helper's directory from
          // mainPath itself instead of assuming a fixed source root.
          const pkgDir = path.dirname(mainPath);
          const helperExt = isKotlin ? '.kt' : '.java';
          const helperPath = path.join(pkgDir, 'ApkforgeOAuthDiagnostics' + helperExt);

          function insertBeforeLastBrace(source, block) {
            const idx = source.lastIndexOf('}');
            if (idx < 0) throw new Error(mainPath + ' is malformed; missing class closing brace.');
            return source.slice(0, idx) + block + '\n' + source.slice(idx);
          }

          // Kotlin uniquely allows a class with no body at all, e.g.
          // `class MainActivity : BridgeActivity()` with no trailing `{ }`. Java's
          // grammar has no equivalent (a class always has braces), so this case is
          // Kotlin-only and must be normalized before any brace-based insertion runs.
          function ensureKotlinClassBody(source) {
            const classDeclRe = /(class\s+MainActivity\s*(?:\([^)]*\))?\s*:\s*[^\n{]+?)(\s*\{)?(\r?\n|$)/;
            const m = classDeclRe.exec(source);
            if (!m) throw new Error(mainPath + ' does not contain a recognizable "class MainActivity : ..." declaration.');
            if (m[2]) return source; // already has an opening brace
            const insertAt = m.index + m[1].length;
            return source.slice(0, insertAt) + ' {\n}' + source.slice(insertAt);
          }

          function injectIntoMethod(source, regex, line) {
            const match = regex.exec(source);
            if (!match) return null;
            // Only insert into a brace-bodied method. An expression-bodied Kotlin
            // function (`override fun onResume() = super.onResume()`) or an abstract
            // signature has no `{` immediately following it, and blindly scanning
            // forward for the next `{` risks landing inside an unrelated method or the
            // class closing brace and corrupting the file — so that case is refused
            // rather than guessed at.
            let i = match.index + match[0].length;
            while (i < source.length && /\s/.test(source[i])) i++;
            if (source[i] !== '{') {
              throw new Error(mainPath + ': found "' + match[0].trim() + '" without a brace-delimited body; refusing to guess where to inject diagnostics (edit the file manually or remove the custom override).');
            }
            const open = i;
            if (source.slice(open, open + 240).includes(line)) return source; // idempotent: already injected
            return source.slice(0, open + 1) + '\n        ' + line + source.slice(open + 1);
          }

          if (/ApkforgeOAuthDiagnostics/.test(main)) {
            log('[oauth-diagnostics] MainActivity lifecycle diagnostics already present');
          } else if (!isKotlin) {
            // ---------------- Java path (unchanged from prior behavior) ----------------
            fs.writeFileSync(helperPath, [
              'package ' + pkg + ';',
              '',
              'import android.app.Activity;',
              'import android.content.Intent;',
              'import android.net.Uri;',
              'import android.util.Log;',
              '',
              'public final class ApkforgeOAuthDiagnostics {',
              '    private static final String TAG = "APKForgeOAuth";',
              '',
              '    public static void logActivity(String stage, Activity activity, Intent intent) {',
              '        try {',
              '            Log.i(TAG, stage + " taskId=" + activity.getTaskId() + " finishing=" + activity.isFinishing() + " changingConfig=" + activity.isChangingConfigurations() + " intent=" + sanitize(intent));',
              '        } catch (Throwable t) {',
              '            Log.e(TAG, "diagnostic logger failed at " + stage, t);',
              '        }',
              '    }',
              '',
              '    private static String sanitize(Intent intent) {',
              '        if (intent == null) return "none";',
              '        Uri data = intent.getData();',
              '        if (data == null) return "action=" + intent.getAction() + " data=none";',
              '        StringBuilder keys = new StringBuilder();',
              '        try {',
              '            for (String name : data.getQueryParameterNames()) {',
              '                String lower = name.toLowerCase();',
              '                if (lower.contains("token") || lower.contains("secret") || lower.contains("password") || lower.contains("refresh") || lower.contains("access")) continue;',
              '                if (keys.length() > 0) keys.append(",");',
              '                keys.append(name);',
              '            }',
              '        } catch (Throwable ignored) {}',
              '        return "action=" + intent.getAction() + " scheme=" + data.getScheme() + " host=" + data.getHost() + " path=" + data.getPath() + " queryKeys=" + keys;',
              '    }',
              '}',
              ''
            ].join('\n'));

            const needsBundle = /void\s+onCreate\s*\(/.test(main) && !/import\s+android\.os\.Bundle;/.test(main);
            const needsIntent = /void\s+onNewIntent\s*\(/.test(main) && !/import\s+android\.content\.Intent;/.test(main);
            if (needsBundle || needsIntent) {
              main = main.replace(/(package\s+[^;]+;\s*)/, '$1\n' + (needsIntent ? 'import android.content.Intent;\n' : '') + (needsBundle ? 'import android.os.Bundle;\n' : ''));
            }
            let patched = injectIntoMethod(main, /(?:public|protected)\s+void\s+onCreate\s*\([^)]*\)/, 'ApkforgeOAuthDiagnostics.logActivity("onCreate", this, getIntent());');
            if (patched) main = patched;
            else main = insertBeforeLastBrace(main, '\n    @Override\n    protected void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        ApkforgeOAuthDiagnostics.logActivity("onCreate", this, getIntent());\n    }\n');
            patched = injectIntoMethod(main, /(?:public|protected)\s+void\s+onNewIntent\s*\([^)]*\)/, 'ApkforgeOAuthDiagnostics.logActivity("onNewIntent", this, intent);');
            if (patched) main = patched;
            else main = insertBeforeLastBrace(main, '\n    @Override\n    public void onNewIntent(android.content.Intent intent) {\n        super.onNewIntent(intent);\n        setIntent(intent);\n        ApkforgeOAuthDiagnostics.logActivity("onNewIntent", this, intent);\n    }\n');
            patched = injectIntoMethod(main, /(?:public|protected)\s+void\s+onResume\s*\([^)]*\)/, 'ApkforgeOAuthDiagnostics.logActivity("onResume", this, getIntent());');
            if (patched) main = patched;
            else main = insertBeforeLastBrace(main, '\n    @Override\n    public void onResume() {\n        super.onResume();\n        ApkforgeOAuthDiagnostics.logActivity("onResume", this, getIntent());\n    }\n');
            patched = injectIntoMethod(main, /(?:public|protected)\s+void\s+onDestroy\s*\([^)]*\)/, 'ApkforgeOAuthDiagnostics.logActivity("onDestroy", this, getIntent());');
            if (patched) main = patched;
            else main = insertBeforeLastBrace(main, '\n    @Override\n    public void onDestroy() {\n        ApkforgeOAuthDiagnostics.logActivity("onDestroy", this, getIntent());\n        super.onDestroy();\n    }\n');
            fs.writeFileSync(mainPath, main);
            log('[oauth-diagnostics] Patched ' + mainPath + ' (Java)');
          } else {
            // ---------------- Kotlin path ----------------
            // A faithful semantic port of the Java helper above: a Kotlin `object` is
            // the idiomatic equivalent of a Java class of static methods (no
            // "Companion" indirection or @JvmStatic is needed because every caller
            // here — MainActivity.kt — is itself Kotlin; @JvmStatic only matters when
            // *Java* code needs to call a Kotlin object member as a real static
            // method, which does not apply to this single-language file pair).
            fs.writeFileSync(helperPath, [
              'package ' + pkg,
              '',
              'import android.app.Activity',
              'import android.content.Intent',
              'import android.net.Uri',
              'import android.util.Log',
              '',
              'object ApkforgeOAuthDiagnostics {',
              '    private const val TAG = "APKForgeOAuth"',
              '',
              '    fun logActivity(stage: String, activity: Activity, intent: Intent?) {',
              '        try {',
              '            Log.i(TAG, stage + " taskId=" + activity.taskId + " finishing=" + activity.isFinishing + " changingConfig=" + activity.isChangingConfigurations + " intent=" + sanitize(intent))',
              '        } catch (t: Throwable) {',
              '            Log.e(TAG, "diagnostic logger failed at " + stage, t)',
              '        }',
              '    }',
              '',
              '    private fun sanitize(intent: Intent?): String {',
              '        if (intent == null) return "none"',
              '        val data: Uri? = intent.data',
              '        if (data == null) return "action=" + intent.action + " data=none"',
              '        val keys = StringBuilder()',
              '        try {',
              '            for (name in data.queryParameterNames) {',
              '                val lower = name.lowercase()',
              '                if (lower.contains("token") || lower.contains("secret") || lower.contains("password") || lower.contains("refresh") || lower.contains("access")) continue',
              '                if (keys.isNotEmpty()) keys.append(",")',
              '                keys.append(name)',
              '            }',
              '        } catch (ignored: Throwable) {}',
              '        return "action=" + intent.action + " scheme=" + data.scheme + " host=" + data.host + " path=" + data.path + " queryKeys=" + keys',
              '    }',
              '}',
              ''
            ].join('\n'));

            main = ensureKotlinClassBody(main);
            const needsBundle = /fun\s+onCreate\s*\(/.test(main) && !/import\s+android\.os\.Bundle/.test(main);
            const needsIntent = /fun\s+onNewIntent\s*\(/.test(main) && !/import\s+android\.content\.Intent/.test(main);
            if (needsBundle || needsIntent) {
              main = main.replace(/(package\s+[^\s;]+\s*)/, '$1\n' + (needsIntent ? 'import android.content.Intent\n' : '') + (needsBundle ? 'import android.os.Bundle\n' : ''));
            }
            let patched = injectIntoMethod(main, /override\s+fun\s+onCreate\s*\([^)]*\)/, 'ApkforgeOAuthDiagnostics.logActivity("onCreate", this, intent)');
            if (patched) main = patched;
            else main = insertBeforeLastBrace(main, '\n    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n        super.onCreate(savedInstanceState)\n        ApkforgeOAuthDiagnostics.logActivity("onCreate", this, intent)\n    }\n');
            patched = injectIntoMethod(main, /override\s+fun\s+onNewIntent\s*\([^)]*\)/, 'ApkforgeOAuthDiagnostics.logActivity("onNewIntent", this, intent)');
            if (patched) main = patched;
            else main = insertBeforeLastBrace(main, '\n    override fun onNewIntent(intent: android.content.Intent) {\n        super.onNewIntent(intent)\n        setIntent(intent)\n        ApkforgeOAuthDiagnostics.logActivity("onNewIntent", this, intent)\n    }\n');
            patched = injectIntoMethod(main, /override\s+fun\s+onResume\s*\([^)]*\)/, 'ApkforgeOAuthDiagnostics.logActivity("onResume", this, intent)');
            if (patched) main = patched;
            else main = insertBeforeLastBrace(main, '\n    override fun onResume() {\n        super.onResume()\n        ApkforgeOAuthDiagnostics.logActivity("onResume", this, intent)\n    }\n');
            patched = injectIntoMethod(main, /override\s+fun\s+onDestroy\s*\([^)]*\)/, 'ApkforgeOAuthDiagnostics.logActivity("onDestroy", this, intent)');
            if (patched) main = patched;
            else main = insertBeforeLastBrace(main, '\n    override fun onDestroy() {\n        ApkforgeOAuthDiagnostics.logActivity("onDestroy", this, intent)\n        super.onDestroy()\n    }\n');
            fs.writeFileSync(mainPath, main);
            log('[oauth-diagnostics] Patched ' + mainPath + ' (Kotlin)');
          }
          log('[oauth-diagnostics] Created sanitized logcat helper at ' + helperPath);
          log('[oauth-diagnostics] Patch completed successfully');
          NODEEOF
          node /tmp/apkforge-mainactivity-diagnostics.cjs
      - name: Decode keystore
        run: |
          set -e
          mkdir -p project/android/app
          echo "${{ secrets.APKFORGE_KEYSTORE_B64 }}" | base64 -d > project/android/app/release.keystore
      - name: Validate Android signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APKFORGE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.APKFORGE_KEY_PASSWORD }}
          CONFIGURED_ALIAS: ${{ secrets.APKFORGE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KS="project/android/app/release.keystore"
          REPORT_S="project/android-signing-diagnostics.txt"
          : > "$REPORT_S"

          log() { echo "$1" | tee -a "$REPORT_S"; }
          fail() { log "SIGNING_VALIDATION_FAILED: $1"; echo "::error::$1"; exit 1; }

          log "========== APKForge signing diagnostics =========="
          log "Keystore path: $KS"
          if [ ! -f "$KS" ]; then
            fail "Missing keystore file after decode. Re-upload the Android keystore in Settings."
          fi
          if [ ! -s "$KS" ]; then
            fail "Decoded keystore is empty. Re-upload a valid .jks or .keystore file."
          fi
          log "Keystore exists: yes"
          log "Keystore size: $(wc -c < "$KS") bytes"

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            fail "Missing keystore password. Update the keystore in Settings."
          fi
          if [ -z "${KEY_PASSWORD:-}" ]; then
            fail "Missing key password. Update the keystore in Settings."
          fi

          LIST_OUT="$(mktemp)"
          if ! keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > "$LIST_OUT" 2>&1; then
            if grep -Eiq "password was incorrect|keystore password was incorrect|tampered with|integrity check failed" "$LIST_OUT"; then
              fail "Invalid keystore password. The saved store password does not open this keystore."
            fi
            if grep -Eiq "Invalid keystore format|Unrecognized keystore format|toDerInputStream rejects tag|not a keystore" "$LIST_OUT"; then
              fail "Corrupted or unsupported keystore file. Upload a valid JKS or PKCS12 keystore."
            fi
            fail "Unable to read keystore: $(tail -n 5 "$LIST_OUT" | tr '\n' ' ' | sed 's/::/:/g')"
          fi
          log "Keystore password: valid"

          ALIASES="$(grep -E '^Alias name:' "$LIST_OUT" | sed 's/^Alias name: //' | sed '/^$/d')"
          ALIAS_COUNT="$(printf '%s\n' "$ALIASES" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$ALIAS_COUNT" = "0" ]; then
            fail "No signing aliases found in the keystore. Upload a keystore containing a private key entry."
          fi
          log "Aliases found ($ALIAS_COUNT):"
          printf '%s\n' "$ALIASES" | sed 's/^/- /' | tee -a "$REPORT_S"

          FINAL_ALIAS="${CONFIGURED_ALIAS:-}"
          if [ -n "$FINAL_ALIAS" ] && printf '%s\n' "$ALIASES" | grep -Fx -- "$FINAL_ALIAS" >/dev/null; then
            log "Configured alias: found"
          elif [ "$ALIAS_COUNT" = "1" ]; then
            FINAL_ALIAS="$(printf '%s\n' "$ALIASES" | head -n 1)"
            log "Configured alias was missing or blank; auto-selected only alias: $FINAL_ALIAS"
          else
            AVAILABLE_ALIASES="$(printf '%s\n' "$ALIASES" | paste -sd ', ' -)"
            log "Configured alias: missing"
            fail "Configured key alias does not exist in the keystore. Available aliases: $AVAILABLE_ALIASES. Update the keystore alias in Settings."
          fi

          KEY_OUT="$(mktemp)"
          if ! keytool -certreq -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$FINAL_ALIAS" -keypass "$KEY_PASSWORD" -file /tmp/apkforge-signing-validation.csr > "$KEY_OUT" 2>&1; then
            if grep -Eiq "Cannot recover key|password was incorrect|Given final block not properly padded|pad block corrupted" "$KEY_OUT"; then
              fail "Invalid key password for alias '$FINAL_ALIAS'. Update the key password in Settings."
            fi
            if grep -Eiq "Alias <.*> does not exist|does not exist" "$KEY_OUT"; then
              fail "Alias '$FINAL_ALIAS' does not exist in the keystore."
            fi
            fail "Unable to validate key password for alias '$FINAL_ALIAS': $(tail -n 5 "$KEY_OUT" | tr '\n' ' ' | sed 's/::/:/g')"
          fi
          log "Key password: valid"
          log "Final signing alias: $FINAL_ALIAS"

          # Record the release certificate's SHA-256 fingerprint so the final
          # APK can be checked against it after Gradle — a signature that
          # verifies but comes from the wrong certificate (e.g. Gradle
          # silently falling back to debug signing) must still fail the build.
          ALIAS_OUT="$(mktemp)"
          keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$FINAL_ALIAS" > "$ALIAS_OUT" 2>&1 || true
          CERT_SHA256="$(grep -A1 -i 'SHA256:' "$ALIAS_OUT" | grep -Eo '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}' | tr -d ':' | tr 'A-F' 'a-f' | head -n 1)"
          if [ -z "$CERT_SHA256" ]; then
            fail "Could not extract the SHA-256 certificate fingerprint for alias '$FINAL_ALIAS' from the keystore. Cannot verify the final APK is signed with the expected certificate."
          fi
          log "Certificate SHA-256: $CERT_SHA256"
          echo "APKFORGE_EXPECTED_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

          log "SIGNING_VALIDATION_PASSED"
          log "========== APKForge signing diagnostics complete =========="
          echo "APKFORGE_VALIDATED_KEY_ALIAS=$FINAL_ALIAS" >> "$GITHUB_ENV"

      - name: Configure explicit Gradle release signing
        working-directory: project/android
        run: |
          set -e
          REPORT_S="../android-signing-diagnostics.txt"
          log() { echo "$1" | tee -a "$REPORT_S"; }
          fail() { log "SIGNING_CONFIG_FAILED: $1"; echo "::error::$1"; exit 1; }

          # -Pandroid.injected.signing.* alone is not a reliable signing
          # mechanism for a plain "./gradlew assembleRelease" invocation —
          # those properties are consumed by Android Studio's own "Generate
          # Signed Bundle/APK" flow, not guaranteed to attach to a normal
          # command-line release build. Relying on it alone is the actual
          # root cause of intermittent unsigned/unreliable release APKs.
          # Patch an explicit signingConfigs block into the app module's
          # build file instead — reading secret values from environment
          # variables at Gradle-evaluation time, never writing them to disk.
          GRADLE_FILE=""
          GRADLE_KIND=""
          if [ -f app/build.gradle.kts ]; then
            GRADLE_FILE="app/build.gradle.kts"; GRADLE_KIND="kts"
          elif [ -f app/build.gradle ]; then
            GRADLE_FILE="app/build.gradle"; GRADLE_KIND="groovy"
          else
            fail "Neither app/build.gradle nor app/build.gradle.kts exists — cannot configure release signing."
          fi
          log "[signing-config] Patching $GRADLE_FILE ($GRADLE_KIND)"
          cp "$GRADLE_FILE" "$GRADLE_FILE.apkforge.bak"
          export GRADLE_FILE GRADLE_KIND

          node <<'NODEEOF'
          const fs = require('fs');
          const kind = process.env.GRADLE_KIND;
          const file = process.env.GRADLE_FILE;
          let src = fs.readFileSync(file, 'utf8');

          const alreadyPatched = src.includes('APKFORGE_MANAGED_SIGNING_CONFIG');

          if (kind === 'groovy') {
            const signingBlock = [
              '',
              '    signingConfigs {',
              '        release {',
              '            // APKFORGE_MANAGED_SIGNING_CONFIG -- generated at build time, values',
              '            // come from environment variables, never written to disk as literals.',
              '            storeFile file(System.getenv("APKFORGE_KS_FILE"))',
              '            storePassword System.getenv("APKFORGE_KS_PASSWORD")',
              '            keyAlias System.getenv("APKFORGE_KEY_ALIAS")',
              '            keyPassword System.getenv("APKFORGE_KEY_PASSWORD")',
              '        }',
              '    }',
              '',
            ].join('\n');
            if (!alreadyPatched) {
              const androidBlockMatch = src.match(/android\s*\{/);
              if (!androidBlockMatch) throw new Error('Could not find an android {} block in ' + file);
              const insertAt = androidBlockMatch.index + androidBlockMatch[0].length;
              src = src.slice(0, insertAt) + signingBlock + src.slice(insertAt);
            }

            if (/buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?signingConfig\s+signingConfigs\.release/.test(src)) {
              // already wired
            } else {
              const buildTypesMatch = src.match(/buildTypes\s*\{/);
              if (!buildTypesMatch) throw new Error('Could not find a buildTypes {} block in ' + file);
              const buildTypesStart = buildTypesMatch.index + buildTypesMatch[0].length;
              // Search for the release block ONLY from here on — searching the
              // whole file would match the signingConfigs.release block just
              // inserted above instead of buildTypes.release.
              const afterBuildTypes = src.slice(buildTypesStart);
              const releaseMatch = afterBuildTypes.match(/release\s*\{/);
              if (!releaseMatch) throw new Error('Could not find a release {} build type block inside buildTypes {} in ' + file);
              const releaseInsertAt = buildTypesStart + releaseMatch.index + releaseMatch[0].length;
              src = src.slice(0, releaseInsertAt) + '\n            signingConfig signingConfigs.release' + src.slice(releaseInsertAt);
            }
          } else {
            const signingBlock = [
              '',
              '    signingConfigs {',
              '        create("release") {',
              '            // APKFORGE_MANAGED_SIGNING_CONFIG -- generated at build time, values',
              '            // come from environment variables, never written to disk as literals.',
              '            storeFile = file(System.getenv("APKFORGE_KS_FILE")!!)',
              '            storePassword = System.getenv("APKFORGE_KS_PASSWORD")',
              '            keyAlias = System.getenv("APKFORGE_KEY_ALIAS")',
              '            keyPassword = System.getenv("APKFORGE_KEY_PASSWORD")',
              '        }',
              '    }',
              '',
            ].join('\n');
            if (!alreadyPatched) {
              const androidBlockMatch = src.match(/android\s*\{/);
              if (!androidBlockMatch) throw new Error('Could not find an android {} block in ' + file);
              const insertAt = androidBlockMatch.index + androidBlockMatch[0].length;
              src = src.slice(0, insertAt) + signingBlock + src.slice(insertAt);
            }

            if (/getByName\("release"\)[\s\S]*?signingConfig\s*=\s*signingConfigs\.getByName\("release"\)/.test(src)) {
              // already wired
            } else {
              const buildTypesMatch = src.match(/buildTypes\s*\{/);
              if (!buildTypesMatch) throw new Error('Could not find a buildTypes {} block in ' + file);
              const buildTypesStart = buildTypesMatch.index + buildTypesMatch[0].length;
              const afterBuildTypes = src.slice(buildTypesStart);
              // Search only from buildTypes onward, same reasoning as the
              // Groovy branch — must not match the signingConfigs.create(...)
              // block just inserted above.
              let releaseMatch = afterBuildTypes.match(/getByName\("release"\)\s*\{/);
              let insertText = '\n            signingConfig = signingConfigs.getByName("release")';
              if (!releaseMatch) releaseMatch = afterBuildTypes.match(/release\s*\{/);
              if (!releaseMatch) throw new Error('Could not find a release build type block inside buildTypes {} in ' + file);
              const releaseInsertAt = buildTypesStart + releaseMatch.index + releaseMatch[0].length;
              src = src.slice(0, releaseInsertAt) + insertText + src.slice(releaseInsertAt);
            }
          }

          fs.writeFileSync(file, src);
          console.log('[signing-config] patched ' + file);
          NODEEOF

          if ! grep -q "APKFORGE_MANAGED_SIGNING_CONFIG" "$GRADLE_FILE"; then
            fail "Failed to patch an explicit signingConfigs block into $GRADLE_FILE — release build would be unsigned or fall back to debug signing."
          fi
          log "[signing-config] Explicit release signingConfig attached in $GRADLE_FILE"
          echo "SIGNING_CONFIG_ATTACHED: yes" | tee -a "$REPORT_S"

      - name: Gradle build
        working-directory: project/android
        env:
          GRADLE_OPTS: "-Xmx2g -Dorg.gradle.jvmargs=-Xmx2g"
          APKFORGE_KS_PASSWORD: ${{ secrets.APKFORGE_KEYSTORE_PASSWORD }}
          APKFORGE_KEY_PASSWORD: ${{ secrets.APKFORGE_KEY_PASSWORD }}
        run: |
          set -e
          # Gradle wrapper preflight (toolchain verification, part 2) — repair first.
          if [ ! -f ./gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "REPAIR: Gradle wrapper is incomplete — regenerating the native Android project" | tee -a "$REPORT"
            cd ..
            rm -rf android
            npx cap add android >> "$REPORT" 2>&1 || true
            npx cap sync android >> "$REPORT" 2>&1 || true
            cd android
          fi
          [ -f ./gradlew ] || { echo "PREBUILD_VALIDATION_FAILED: DEPENDENCY_VALIDATION_FAILED: android/gradlew is missing and could not be regenerated." | tee -a "$REPORT"; exit 1; }
          [ -f gradle/wrapper/gradle-wrapper.properties ] || { echo "PREBUILD_VALIDATION_FAILED: DEPENDENCY_VALIDATION_FAILED: android/gradle/wrapper/gradle-wrapper.properties is missing, so no Gradle version is declared." | tee -a "$REPORT"; exit 1; }
          grep -n "distributionUrl" gradle/wrapper/gradle-wrapper.properties | tee -a "$REPORT"
          chmod +x ./gradlew
          ./gradlew --version | sed -n '1,8p' | tee -a "$REPORT"

          # Gradle evaluates app/build.gradle before running every task,
          # including the clean task. Export signing inputs before the first Gradle
          # task so storeFile never receives null during configuration.
          export APKFORGE_KS_FILE="${{ github.workspace }}/project/android/app/release.keystore"
          export APKFORGE_KEY_ALIAS="$APKFORGE_VALIDATED_KEY_ALIAS"
          [ -f "$APKFORGE_KS_FILE" ] || { echo "PREBUILD_VALIDATION_FAILED: SIGNING_CONFIG_FAILED: release keystore is missing at $APKFORGE_KS_FILE." | tee -a "$REPORT"; exit 1; }
          [ -n "$APKFORGE_KS_PASSWORD" ] || { echo "PREBUILD_VALIDATION_FAILED: SIGNING_CONFIG_FAILED: keystore password is unavailable." | tee -a "$REPORT"; exit 1; }
          [ -n "$APKFORGE_KEY_ALIAS" ] || { echo "PREBUILD_VALIDATION_FAILED: SIGNING_CONFIG_FAILED: validated key alias is unavailable." | tee -a "$REPORT"; exit 1; }
          [ -n "$APKFORGE_KEY_PASSWORD" ] || { echo "PREBUILD_VALIDATION_FAILED: SIGNING_CONFIG_FAILED: key password is unavailable." | tee -a "$REPORT"; exit 1; }
          ./gradlew --no-daemon clean
          # The explicit signingConfigs block patched into build.gradle above
          # reads APKFORGE_KS_FILE / APKFORGE_KS_PASSWORD / APKFORGE_KEY_ALIAS /
          # APKFORGE_KEY_PASSWORD directly via System.getenv(...) — that is now
          # the real signing mechanism. The -Pandroid.injected.signing.* flags
          # are kept as a harmless redundant fallback only; they are not relied
          # upon.
          KS_PASS="${{ secrets.APKFORGE_KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.APKFORGE_KEY_PASSWORD }}"
          KS_FILE="$APKFORGE_KS_FILE"
          gradle_release() {
            ./gradlew --no-daemon "$1" \
              -Pandroid.injected.signing.store.file="$KS_FILE" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$APKFORGE_VALIDATED_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          }
          gradle_release assembleRelease
          # Gradle leaves app-release-unsigned.apk behind whenever it also had to
          # produce an unsigned variant. Both files match the artifact upload
          # glob, so the user could be handed the unsigned one even though
          # verification inspected the signed file. Delete the unsigned copies
          # immediately: nothing downstream may ever see them.
          find app/build/outputs/apk/release -name '*unsigned*.apk' -print -delete 2>/dev/null \
            | sed 's/^/[signing] removed unsigned Gradle leftover: /' | tee -a "$REPORT" || true
          # The bundle is best effort: a project that cannot produce an .aab
          # must not fail an otherwise good APK build. The outcome is recorded
          # so the app can explain the missing bundle instead of hiding it.
          if gradle_release bundleRelease > /tmp/apkforge-bundle.log 2>&1; then
            echo "AAB_STATUS: produced" | tee android-aab-status.txt
          else
            echo "AAB_STATUS: bundleRelease failed" | tee android-aab-status.txt
            tail -n 60 /tmp/apkforge-bundle.log | tee -a android-aab-status.txt
            echo "::warning::AAB (bundleRelease) could not be produced; APK is unaffected."
          fi




      - name: Verify release APK
        working-directory: project
        run: |
          set -e
          VERIFY="android-apk-verification.txt"
          : > "$VERIFY"
          log() { echo "$1" | tee -a "$VERIFY"; }
          fail() { log "APK_VERIFICATION_FAILED: $1"; echo "::error::$1"; exit 1; }

          # Never pick an unsigned Gradle output: "app-release-unsigned.apk" also
          # matches *.apk, and picking it here (or in the artifact upload) is how
          # an unsigned APK reaches the user while verification "passes".
          UNSIGNED="$(find android/app/build/outputs/apk/release -name '*unsigned*.apk' 2>/dev/null | head -n 1 || true)"
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' 2>/dev/null | sort | head -n 1 || true)"
          if [ -z "$APK" ]; then
            [ -z "$UNSIGNED" ] || fail "Gradle produced only an unsigned APK ($UNSIGNED) — the release signingConfig was not applied, so no signed APK exists to deliver."
            fail "No release APK was produced by Gradle."
          fi
          if [ -n "$UNSIGNED" ]; then
            log "Removing unsigned Gradle leftover so it can never be delivered: $UNSIGNED"
            rm -f "$UNSIGNED"
          fi
          log "========== APKForge APK verification =========="
          log "APK: $APK ($(wc -c < "$APK") bytes)"

          BT_DIR="$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)"
          AAPT2="$BT_DIR/aapt2"; APKSIGNER="$BT_DIR/apksigner"
          cat > /tmp/apkforge-manifest-structural-check.cjs <<'CHECKEOF'
          // Structural AndroidManifest intent-filter verifier.
          //
          // Confirms that action VIEW, category DEFAULT, category BROWSABLE and a
          // matching URI scheme all live inside the SAME <intent-filter> element,
          // instead of checking whether each string occurs anywhere in the file
          // independently. Four attributes scattered across four unrelated
          // intent-filters (e.g. one added by a push-notification plugin, one for
          // https App Links, one for an unrelated custom scheme) previously satisfied
          // four separate greps and reported a deep link as present when it was not.
          //
          // Works against two input shapes:
          //   - raw AndroidManifest.xml source (source tree, pre-build)
          //   - `aapt2 dump xmltree --file AndroidManifest.xml <apk>` output (packaged APK)
          // so the same logic gates both the pre-build patch and the final artifact.
          //
          // Usage: node apkforge-manifest-structural-check.cjs <file> [schemesCsv] [host]
          const fs = require('fs');

          const file = process.argv[2];
          const expectedSchemesArg = process.argv[3] || '';
          const expectedHost = process.argv[4] || '';

          if (!file || !fs.existsSync(file)) {
            console.error('[manifest-check] FAIL file not found: ' + file);
            process.exit(1);
          }
          const text = fs.readFileSync(file, 'utf8');
          const expectedSchemes = expectedSchemesArg.split(',').map((s) => s.trim()).filter(Boolean);

          function extractBlocksXml(t) {
            const blocks = [];
            const re = /<intent-filter\b[\s\S]*?<\/intent-filter>/g;
            let m;
            while ((m = re.exec(t))) blocks.push(m[0]);
            return blocks;
          }

          // aapt2's xmltree dump nests children under a line like `E: intent-filter (line=42)`
          // using two-space indentation per level; the block ends at the first line back at
          // or above that indentation.
          function extractBlocksXmltree(t) {
            const lines = t.split('\n');
            const blocks = [];
            let collecting = false;
            let baseIndent = -1;
            let current = [];
            const indentOf = (l) => (l.match(/^\s*/) || [''])[0].length;
            for (const line of lines) {
              if (/E: intent-filter\b/.test(line)) {
                if (collecting) blocks.push(current.join('\n'));
                collecting = true;
                baseIndent = indentOf(line);
                current = [line];
                continue;
              }
              if (collecting) {
                if (line.trim() === '') { current.push(line); continue; }
                const ind = indentOf(line);
                if (ind <= baseIndent) {
                  blocks.push(current.join('\n'));
                  collecting = false;
                  current = [];
                } else {
                  current.push(line);
                }
              }
            }
            if (collecting) blocks.push(current.join('\n'));
            return blocks;
          }

          const isXmltree = /E: manifest\b/.test(text) || /E: intent-filter\b/.test(text) || /^N: android=/.test(text);
          const blocks = isXmltree ? extractBlocksXmltree(text) : extractBlocksXml(text);

          if (!blocks.length) {
            console.error('[manifest-check] FAIL no <intent-filter> elements found in ' + file);
            process.exit(1);
          }

          const has = (block, needle) => block.toLowerCase().includes(needle.toLowerCase());

          let matched = null;
          let matchedScheme = null;
          const nearMisses = [];
          for (const b of blocks) {
            const hasView = has(b, 'android.intent.action.view');
            const hasDefault = has(b, 'android.intent.category.default');
            const hasBrowsable = has(b, 'android.intent.category.browsable');
            if (!(hasView && hasDefault && hasBrowsable)) {
              nearMisses.push('view=' + hasView + ' default=' + hasDefault + ' browsable=' + hasBrowsable);
              continue;
            }
            // Match "scheme" and the expected value inside the same line, quoted —
            // this covers both raw-XML (`android:scheme="duospace"`) and aapt2
            // xmltree (`android:scheme(0x01010027)="duospace"`) shapes, where an
            // attribute's resource-id hex blob sits between the name and the value.
            const valueOnSameLine = (attr, value) => {
              const escaped = value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(attr + '[^\\n]*["\']' + escaped + '["\']', 'i');
              return b.split('\n').some((line) => re.test(line));
            };
            const schemeMatch = expectedSchemes.find((s) => valueOnSameLine('scheme', s));
            const schemeOk = expectedSchemes.length === 0 || !!schemeMatch;
            const hostOk = !expectedHost || valueOnSameLine('host', expectedHost);
            if (schemeOk && hostOk) {
              matched = b;
              matchedScheme = schemeMatch || '(any)';
              break;
            }
          }

          if (!matched) {
            console.error(
              '[manifest-check] FAIL no single <intent-filter> in ' + file +
              ' contains action VIEW + category DEFAULT + category BROWSABLE' +
              (expectedSchemes.length ? ' + scheme in [' + expectedSchemes.join(', ') + ']' : '') +
              (expectedHost ? ' + host=' + expectedHost : '') +
              ' together (' + blocks.length + ' intent-filter element(s) inspected: ' + nearMisses.join(' | ') + ')'
            );
            process.exit(1);
          }
          console.log(
            '[manifest-check] PASS structurally valid VIEW/DEFAULT/BROWSABLE intent-filter found in ' + file +
            (expectedSchemes.length ? ' (scheme=' + matchedScheme + ')' : '')
          );
          process.exit(0);
          CHECKEOF

          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/apk-verify.txt 2>&1 || {
              cat /tmp/apk-verify.txt | tee -a "$VERIFY"
              fail "The release APK is not correctly signed."
            }
            cat /tmp/apk-verify.txt | tee -a "$VERIFY"
            # A v1-only signature is rejected by Play and by Android 11+ for
            # fresh installs on some devices, so "verifies" is not sufficient:
            # require the APK Signature Scheme v2 (or v3) that Gradle produces
            # when the signingConfig really applied.
            if grep -Eqi '\(APK Signature Scheme v[23]\): true' /tmp/apk-verify.txt; then
              log "Signature: valid (v2/v3 scheme present)"
            else
              grep -Ei 'Verified using' /tmp/apk-verify.txt | tee -a "$VERIFY"
              fail "The release APK carries no APK Signature Scheme v2/v3 block. Android and Google Play reject such a build as improperly signed — the release signingConfig did not apply correctly."
            fi


            # A signature that merely *verifies* is not enough — Gradle must
            # have signed with the same certificate the preflight step
            # validated. Without this check, a silent fallback to debug
            # signing (or the wrong keystore) would still say "signed
            # correctly" here.
            if [ -n "${APKFORGE_EXPECTED_CERT_SHA256:-}" ]; then
              ACTUAL_SHA256="$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -i 'SHA-256 digest' | head -n 1 | sed -E 's/.*: *//' | tr -d ' ' | tr 'A-F' 'a-f')"
              if [ -z "$ACTUAL_SHA256" ]; then
                fail "Could not extract the signing certificate's SHA-256 digest from the built APK to verify it against the configured keystore."
              fi
              log "Expected certificate SHA-256: ${APKFORGE_EXPECTED_CERT_SHA256}"
              log "Actual certificate SHA-256:   $ACTUAL_SHA256"
              if [ "$ACTUAL_SHA256" != "${APKFORGE_EXPECTED_CERT_SHA256}" ]; then
                fail "The release APK is signed with a certificate that does not match the configured keystore (expected ${APKFORGE_EXPECTED_CERT_SHA256}, got $ACTUAL_SHA256). This usually means Gradle fell back to debug signing or used a different keystore — the build must not be trusted."
              fi
              log "Certificate fingerprint: matches configured keystore"
            else
              log "::warning::No expected certificate fingerprint was recorded during signing preflight — skipping certificate-match verification."
            fi
          else
            jarsigner -verify "$APK" | tee -a "$VERIFY" || fail "The release APK is not correctly signed."
            log "Signature: valid (jarsigner)"
            log "::warning::apksigner unavailable — falling back to jarsigner, which cannot verify the certificate fingerprint matches the configured keystore."
          fi

          if [ -x "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" > /tmp/badging.txt 2>&1 || fail "Could not read the APK manifest."
            PKG="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" /tmp/badging.txt | head -n 1)"
            log "Package: $PKG (expected $BUNDLE_ID)"
            [ "$PKG" = "$BUNDLE_ID" ] || fail "APK package '$PKG' does not match the configured bundle id '$BUNDLE_ID'."

            "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/xmltree.txt 2>&1 || true

            # Structural check: VIEW action + DEFAULT + BROWSABLE categories +
            # a matching scheme must all live inside the SAME <intent-filter>
            # element in the packaged manifest. Checking each independently
            # (as before) is exactly the false-positive that let an APK with
            # no real OAuth callback route through verification: four
            # unrelated intent-filters (an analytics deep link, a
            # push-notification scheme, an https App Link, ...) can each
            # satisfy one substring check without any single one of them
            # being a working deep link.
            EXPECTED_SCHEMES=""
            [ -f android-expected-schemes.txt ] && EXPECTED_SCHEMES="$(paste -sd, android-expected-schemes.txt)"
            node /tmp/apkforge-manifest-structural-check.cjs /tmp/xmltree.txt "$EXPECTED_SCHEMES" >> "$VERIFY" 2>&1 \
              || fail "The APK's packaged AndroidManifest.xml has no single intent-filter containing action VIEW + category DEFAULT + category BROWSABLE + a matching URL scheme (${EXPECTED_SCHEMES:-none expected}). See android-apk-verification.txt for which intent-filter(s) were inspected."
            log "Deep-link intent filter: structurally valid (VIEW + DEFAULT + BROWSABLE + scheme in one <intent-filter>)"

            grep -Eqi "BridgeActivity|MainActivity" /tmp/xmltree.txt || fail "No Capacitor bridge activity found in the APK manifest."
            log "Capacitor bridge activity: present"
          else
            log "WARNING: aapt2 not available — skipped manifest introspection"
          fi

          unzip -l "$APK" | grep -q "assets/public/index.html" || fail "Web assets are missing from the APK (assets/public/index.html not found)."
          log "Web assets: bundled"

          # ---- APK_VERIFICATION: plugins, from the native manifest only ----
          # The authoritative plugin set is native-manifest.json, produced in
          # NATIVE_PLUGIN_RESOLUTION from the resolved dependency graph. This
          # stage never re-derives requirements from text matching, so a
          # JS-only package (e.g. @capacitor/synapse) can never be demanded.
          if [ -n "${APKFORGE_REQUIRED_PLUGINS:-}" ]; then
            unzip -p "$APK" assets/capacitor.plugins.json > /tmp/apk-plugins.json 2>/dev/null \
              || fail "stage=APK_VERIFICATION command='unzip -p $APK assets/capacitor.plugins.json' file=android/app/src/main/assets/capacitor.plugins.json detected=absent-from-apk expected='registry listing ${APKFORGE_REQUIRED_PLUGINS}' remediation='cap sync android must succeed before assembleRelease so the plugin registry is packaged'"
            cat /tmp/apk-plugins.json | tee -a "$VERIFY"
            REQ_MISSING=""
            for p in $(echo "$APKFORGE_REQUIRED_PLUGINS" | tr ',' ' '); do
              grep -q "\"$p\"" /tmp/apk-plugins.json || REQ_MISSING="$REQ_MISSING $p"
            done
            [ -z "$REQ_MISSING" ] || fail "stage=APK_VERIFICATION command='unzip -p $APK assets/capacitor.plugins.json' package='$REQ_MISSING' detected=not-listed expected=listed-in-packaged-registry remediation='these packages are runtime-required per native-manifest.json (application imports them or their plugin name is registered in the shipped bundle); confirm each is a native plugin compatible with @capacitor/core major ${APKFORGE_CAP_CORE_MAJOR:-?} and re-run cap sync android'"
            log "Runtime-required plugins packaged: ${APKFORGE_REQUIRED_PLUGINS}"
          else
            log "native-manifest.json lists no runtime-required native plugins — packaged plugin registry check not applicable"
          fi

          # Compiled-class verification uses the fully-qualified class names the
          # resolver read out of each plugin's own Android sources (pkg=FQCN),
          # so nothing is guessed and third-party plugins are verified exactly
          # like official ones.
          if [ -n "${APKFORGE_DEX_CLASSES:-}" ]; then
            DEX_LIST="$(unzip -Z1 "$APK" 'classes*.dex' 2>/dev/null)"
            DEX_STRINGS_FILE="$(mktemp)"
            for DEX in $DEX_LIST; do
              unzip -p "$APK" "$DEX" 2>/dev/null | strings >> "$DEX_STRINGS_FILE"
            done
            DEX_CLASS_MISSING=""
            for ENTRY in $(echo "$APKFORGE_DEX_CLASSES" | tr ',' ' '); do
              EPKG="${ENTRY%%=*}"; FQCN="${ENTRY#*=}"
              [ -n "$FQCN" ] || continue
              CLASS_PATH="$(echo "$FQCN" | tr '.' '/')"
              # A class name can arrive with a masked segment (Actions redacts any
              # substring matching a secret), so an exact match is not always
              # possible. In that case the package path prefix is authoritative.
              case "$FQCN" in
                *'*'*) CLASS_PATH="$(echo "$FQCN" | sed -E 's/[^.]*\*+[^.]*//g; s/\.+/./g; s/\.$//' | tr '.' '/')" ;;
              esac
              if grep -qF "$CLASS_PATH" "$DEX_STRINGS_FILE" 2>/dev/null; then
                log "DEX class present: $EPKG -> $FQCN"
              else
                log "DEX class NOT FOUND: $EPKG -> $FQCN"
                # Precise diagnosis instead of a guess: did the plugin's own
                # Gradle module compile anything at all?
                MOD_DIR="node_modules/$EPKG/android"
                COMPILED="$(find "$MOD_DIR/build" -name '*.class' 2>/dev/null | wc -l | tr -d ' ')"
                SRC_COUNT="$(find "$MOD_DIR" -name '*.java' -o -name '*.kt' 2>/dev/null | grep -vc '/build/' || true)"
                log "  diagnosis: $EPKG sources=$SRC_COUNT compiled-classes=${COMPILED:-0} (module $MOD_DIR)"
                if [ "${COMPILED:-0}" = "0" ]; then
                  log "  cause: the plugin Gradle module produced no compiled classes — its Android sources were not compiled by any Gradle task"
                fi
                DEX_CLASS_MISSING="$DEX_CLASS_MISSING $EPKG"
              fi
            done
            rm -f "$DEX_STRINGS_FILE"
            [ -z "$DEX_CLASS_MISSING" ] || fail "stage=APK_VERIFICATION command='unzip -p $APK classes*.dex | strings' package='$DEX_CLASS_MISSING' detected=class-absent-from-dex expected='the @CapacitorPlugin class declared in the package Android sources compiled into the APK' remediation='see the per-package diagnosis lines above — when the module produced no compiled classes, its Android module build script does not compile its sources (missing Kotlin plugin, wrong source set path, or empty android/src); fix the plugin package and re-upload'"
            log "DEX-level plugin verification: passed (classes taken from plugin sources, not guessed)"
          fi

          log "APK_VERIFICATION_PASSED"

          # ----- App Bundle (.aab) -----
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -n 1 || true)"
          if [ -z "$AAB" ]; then
            log "AAB: not produced (see android-aab-status.txt) — the APK is unaffected."
          else
            log "AAB: $AAB ($(wc -c < "$AAB") bytes)"
            # An .aab is NOT an APK: apksigner requires AndroidManifest.xml at the
            # zip root and always fails with "Missing AndroidManifest.xml" on a
            # bundle. Bundles carry a JAR (v1) signature. Do not use jarsigner's
            # -strict mode here: current JDKs cross-check ZIP streams in a way that
            # reports valid AAB entries as "signed in JarFile but is not signed in
            # JarInputStream" and returns exit 1. Normal verification still checks
            # every signed entry; keytool below independently proves the signer is
            # the exact certificate selected during signing preflight.
            if command -v jarsigner >/dev/null 2>&1; then
              LC_ALL=C jarsigner -verify "$AAB" > /tmp/aab-verify.txt 2>&1 || {
                cat /tmp/aab-verify.txt | tee -a "$VERIFY"
                fail "The release App Bundle is not correctly signed."
              }
              cat /tmp/aab-verify.txt | tee -a "$VERIFY"
              grep -Eq 'jar verified.|jar verified, with signer errors.' /tmp/aab-verify.txt || fail "The App Bundle verifier did not confirm a valid JAR signature."
              if command -v keytool >/dev/null 2>&1; then
                LC_ALL=C keytool -printcert -jarfile "$AAB" > /tmp/aab-certs.txt 2>&1 || {
                  cat /tmp/aab-certs.txt | tee -a "$VERIFY"
                  fail "Could not read the signing certificate from the App Bundle."
                }
                cat /tmp/aab-certs.txt | tee -a "$VERIFY"
                if [ -n "${APKFORGE_EXPECTED_CERT_SHA256:-}" ]; then
                  AAB_SHA256="$(grep -i 'SHA256:' /tmp/aab-certs.txt | head -n 1 | sed -E 's/.*SHA256: *//' | tr -d ' :' | tr 'A-F' 'a-f')"
                  if [ -z "$AAB_SHA256" ]; then
                    fail "Could not extract the App Bundle signing certificate fingerprint."
                  fi
                  if [ "$AAB_SHA256" != "${APKFORGE_EXPECTED_CERT_SHA256}" ]; then
                    fail "The release App Bundle is signed with a certificate that does not match the configured keystore (expected ${APKFORGE_EXPECTED_CERT_SHA256}, got $AAB_SHA256)."
                  fi
                  log "AAB certificate fingerprint: matches configured keystore"
                fi
              else
                fail "keytool is unavailable, so the App Bundle signer cannot be matched to the configured keystore."
              fi
            else
              fail "jarsigner is unavailable, so the App Bundle signature cannot be verified."
            fi

            log "AAB_VERIFICATION_PASSED"
          fi



      - name: Browser plugin forensic trace (post-APK)
        if: success() || failure()
        working-directory: project
        run: |
          set +e
          if [ -f /tmp/apkforge-browser-trace.sh ]; then
            bash /tmp/apkforge-browser-trace.sh post-apk
          else
            echo "Browser plugin trace script unavailable (pipeline failed before sync)."
          fi
          exit 0

      - name: Preferences plugin forensic trace (post-APK)
        if: success() || failure()
        working-directory: project
        run: |
          set +e
          if [ -f /tmp/apkforge-preferences-trace.sh ]; then
            bash /tmp/apkforge-preferences-trace.sh post-apk
          else
            echo "Preferences plugin trace script unavailable (pipeline failed before sync)."
          fi
          exit 0

      - name: App plugin forensic trace (post-APK)
        if: success() || failure()
        working-directory: project
        run: |
          set +e
          if [ -f /tmp/apkforge-app-trace.sh ]; then
            bash /tmp/apkforge-app-trace.sh post-apk
          else
            echo "App plugin trace script unavailable (pipeline failed before sync)."
          fi
          exit 0




      - name: Final diagnostics report
        if: success() || failure()
        working-directory: project
        run: |
          set +e
          FINAL="android-build-report.txt"
          {
            echo "========== APKForge final build report =========="
            echo "Build id:            ${BUILD_ID}"
            echo "App name:            ${APP_NAME}"
            echo "Bundle id:           ${BUNDLE_ID}"
            echo "Framework:           ${DETECTED_FRAMEWORK:-unknown}"
            echo "Package manager:     ${PM:-npm}"
            echo "Build command:       ${RUN_CMD:-npm run} build"
            echo "Declared webDir:     ${DECLARED_WEB_DIR:-${WEB_DIR}}"
            echo "Resolved webDir:     ${RESOLVED_WEB_DIR:-unresolved}"
            echo "index.html:          ${RESOLVED_WEB_DIR:-?}/index.html"
            echo "Capacitor config:    ${CAP_CONFIG_PATH:-none}"
            echo "Capacitor version:   $(npx cap --version 2>/dev/null || echo unknown)"
            echo "Java version:        $(java -version 2>&1 | head -n 1)"
            echo "Gradle version:      $( [ -f android/gradle/wrapper/gradle-wrapper.properties ] && sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p' android/gradle/wrapper/gradle-wrapper.properties | head -n 1 || echo unknown )"
            echo "Android SDK:         ${ANDROID_HOME:-not set}"
            echo "Signing alias:       ${APKFORGE_VALIDATED_KEY_ALIAS:-unresolved}"
            echo "Native plugins:      ${APKFORGE_PLUGINS:-none}"
            echo "Runtime-required:    ${APKFORGE_REQUIRED_PLUGINS:-none}"
            echo "Auto-installed:      ${APKFORGE_AUTO_PLUGINS:-none}"
            echo "Repaired files:      ${APKFORGE_REPAIRS:-none}"
            echo "Artifacts (path + sha256):"
            for F in $(find android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null) $(find android/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null); do
              echo "  $F  $(sha256sum "$F" 2>/dev/null | awk '{print $1}')  $(wc -c < "$F") bytes"
            done
            echo "Runtime OAuth:       NOT tested in CI — manual device testing required."
            echo "================================================="
            echo
            [ -f native-manifest.json ] && { echo "----- native-manifest.json (authoritative plugin manifest) -----"; cat native-manifest.json; echo; }
            [ -f android-prebuild-report.txt ] && cat android-prebuild-report.txt
            echo
            [ -f android-signing-diagnostics.txt ] && cat android-signing-diagnostics.txt
            echo
            [ -f android-apk-verification.txt ] && cat android-apk-verification.txt
            echo
            [ -f android-aab-status.txt ] && cat android-aab-status.txt
            echo
            [ -f browser-plugin-trace.txt ] && cat browser-plugin-trace.txt
            echo
            [ -f preferences-plugin-trace.txt ] && cat preferences-plugin-trace.txt
            echo
            [ -f app-plugin-trace.txt ] && cat app-plugin-trace.txt

          } > "$FINAL" 2>&1
          cat "$FINAL"

      - name: Upload APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_id }}
          path: |
            project/android/app/build/outputs/apk/release/*.apk
            project/android-build-report.txt
            project/android-prebuild-report.txt
            project/android-signing-diagnostics.txt
            project/android-apk-verification.txt
            project/android-aab-status.txt
            project/browser-plugin-trace.txt
            project/preferences-plugin-trace.txt
            project/app-plugin-trace.txt
            project/native-manifest.json
          if-no-files-found: error
      - name: Upload AAB
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ github.event.inputs.build_id }}
          path: project/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.event.inputs.build_id }}
          path: |
            project/android-build-report.txt
            project/android-prebuild-report.txt
            project/android-signing-diagnostics.txt
            project/android-apk-verification.txt
            project/android-aab-status.txt
            project/browser-plugin-trace.txt
            project/preferences-plugin-trace.txt
            project/app-plugin-trace.txt
            project/native-manifest.json
          if-no-files-found: ignore

      - name: Finalize APKForge build
        if: always()
        run: |
          set +e
          if [ -z "${FINALIZE_ENDPOINT:-}" ] || [ -z "${DIAGNOSTIC_TOKEN:-}" ]; then
            echo "APKForge finalize skipped: no endpoint/token"
            exit 0
          fi
          python3 - <<'PYEOF' > /tmp/apkforge-finalize.json
          import json, os
          print(json.dumps({
            "buildId": os.environ.get("BUILD_ID", ""),
            "token": os.environ.get("DIAGNOSTIC_TOKEN", ""),
            "runId": os.environ.get("GITHUB_RUN_ID", ""),
            "jobStatus": "${{ job.status }}",
          }))
          PYEOF
          curl -fsS -X POST "$FINALIZE_ENDPOINT" -H 'content-type: application/json' --data-binary @/tmp/apkforge-finalize.json || true
