              # "does the substring BROWSABLE occur anywhere in a strings(1)
              # dump" check previously reported a false PASS whenever any
              # unrelated intent-filter (or even an unrelated string in the
              # binary) happened to contain that word, regardless of whether
              # a real VIEW/DEFAULT/BROWSABLE deep-link filter existed. Use
              # aapt2's structural xmltree dump instead, and require VIEW +
              # DEFAULT + BROWSABLE + scheme to co-occur in one intent-filter.
              APP_BT_DIR="$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)"
