                  out "11 PASS  final packaged AndroidManifest.xml retains a structurally valid VIEW/DEFAULT/BROWSABLE intent filter"
                else
                  out "11 FAIL  final packaged AndroidManifest.xml has no structurally valid VIEW/DEFAULT/BROWSABLE intent filter"
                  note "stage 11 — the deep-link intent filter did not survive into the final packaged manifest"
                fi
              else
                out "11 WARN  aapt2 unavailable — could not structurally verify the packaged manifest (authoritative check runs in 'Verify release APK')"
              fi
            fi
          fi

          if [ -n "$VERDICT" ]; then
            out "APP_TRACE_VERDICT: $VERDICT"
          else
            out "APP_TRACE_VERDICT: present end-to-end ($PHASE)"
          fi
          out "========== end App plugin trace ($PHASE) =========="
